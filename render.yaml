# Render Blueprint (free web service, Docker runtime). Region virginia: Qloo's API resolves to
# AWS us-east-1, and one audit run makes many Qloo calls but few browser requests (docs/decisions.md D22).
# Secrets are marked sync:false so Render asks for them in the dashboard; nothing secret is in git.
services:
  - type: web
    name: blindspot
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_MODE
        value: live
      - key: QLOO_ENABLED
        value: "true"
      # Three trusted hops: Cloudflare edge -> Render edge -> Render internal proxy -> app.
      # VERIFIED 2026-10-19 with the proxy-headers probe (#80): X-Forwarded-For has 3 entries
      # [client, edge, internal]; forged values are appended on the left; entry [-3] is identical
      # on every request and equals cf-connecting-ip. With 1 or 2 the app read a varying proxy
      # address, so every request looked like a new client.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Hosted caps share the key's 10,000/month quota with local Phase 2-7 work (decisions D33).
      # Web traffic is ad-hoc priority, so it gets at most DAILY - RESERVE = 100 live calls/day.
      # Counters reset on every redeploy (SQLite on an ephemeral disk) until #20.
      # Revisit in #57/#58 once the demo is precomputed and mostly snapshot-served.
      - key: QLOO_DAILY_LIVE_CAP
        value: "150"
      - key: QLOO_CLIENT_HOURLY_CAP
        value: "30"
      - key: QLOO_RUN_CAP
        value: "150"
      - key: QLOO_DEMO_RESERVE
        value: "50"
      - key: QLOO_MAX_LIVE_CALLS
        value: "100000"
      - key: QLOO_RPS
        value: "4"
      - key: REQUEST_DEADLINE_S
        value: "8"
      # Private snapshot uploaded as a Render "Secret File" named snapshot.json (optional).
      - key: QLOO_SNAPSHOT_PATH
        value: /etc/secrets/snapshot.json
      - key: ALLOWED_ORIGINS
        sync: false
