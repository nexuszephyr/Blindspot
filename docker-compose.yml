# docker compose up --build   ->  http://127.0.0.1:8000/healthz
# Port 8000 busy? BLINDSPOT_PORT=8010 docker compose up --build
# Works with or without a .env file (no key = replay mode).
name: blindspot
services:
  blindspot:
    build: .
    image: blindspot:local
    ports:
      - "127.0.0.1:${BLINDSPOT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      # named volume: persists the cache between restarts and is writable by the non-root user
      - blindspot-data:/app/data
      # optional private snapshot (never committed):
      # - ./data/snapshot:/app/data/snapshot:ro
    restart: unless-stopped

volumes:
  blindspot-data:
