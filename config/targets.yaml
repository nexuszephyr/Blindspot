# Target models the audit asks (#27, decisions D49). Loaded and validated by
# blindspot.targets.load_targets(); field reference in src/blindspot/targets/config.py.
#
# Values come from the environment only: `base_url_env` and `api_key_env` name variables, never
# values. `base_url_default` is a public endpoint used when the base-URL variable is unset.
# Exactly one target is the fix-loop agent (#42/#43).
targets:
  - id: gemini-flash
    display_name: Gemini 3.8 Flash
    base_url_env: GEMINI_BASE_URL
    base_url_default: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemini-3.8-flash
    live_in_demo: false               # precomputed in batches (#57)
    tool_calling: true
    fix_loop_agent: false
    max_tokens: 1000                  # hidden thinking counts against it (D49)
    seed: false                       # Gemini rejects `seed` with a 400 (D49)
    extra_body: {reasoning_effort: low}   # or its hidden thinking eats max_tokens (D49)
    timeout_s: 90                     # 15 to 62 s per request on the free tier (D49)
  - id: gpt-oss-120b
    display_name: GPT-OSS 120B
    base_url_env: GROQ_BASE_URL
    base_url_default: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    live_in_demo: false
    tool_calling: true
    fix_loop_agent: true              # #42/#43
    max_tokens: 1000                  # reasoning tokens count against it (D49)
    timeout_s: 20
  - id: gpt-oss-20b
    display_name: GPT-OSS 20B
    base_url_env: GROQ_BASE_URL
    base_url_default: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-20b
    live_in_demo: true                # capped in #38
    tool_calling: true
    fix_loop_agent: false             # tool-calling backup
    max_tokens: 1000
    timeout_s: 20
  - id: qwen-27b                      # optional; a Groq Preview model
    display_name: Qwen3.8 27B
    base_url_env: GROQ_BASE_URL
    base_url_default: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: qwen/qwen3.8-27b
    live_in_demo: false
    tool_calling: false               # not tested
    fix_loop_agent: false
    max_tokens: 1000
    timeout_s: 20
