name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options: [Hosted demo, Local with own key, Local with no key, CI]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove any API key or personal data before pasting.
      render: text
