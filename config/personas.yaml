# Who takes the exam. Data, not code: the scenario generator (#16) reads this file and the
# resolver (#15) turns every name below into a Qloo id. Field reference: docs/scenarios.md.
#
# Rules the loader (src/blindspot/catalog.py) enforces:
# - Describe taste, never identity. Identity-based audiences (communities, political or belief
#   types, or religion/ethnicity/orientation terms) are rejected unless allow_identity is true,
#   which needs the maintainer's approval (AGENTS §13).
# - Every domain's answer-key shape uses the persona's audience (E13, D35), so each persona needs
#   at least one audience, and no two personas may share the same audience set (their answer keys
#   would be identical).
# - Every enabled domain needs a stated taste (seeds or interest_tags, 1 to 3 each); target prompts
#   mention only these, the age band and the city (AGENTS §8).
#
# audiences: a resolved `urn:audience:<type>:<id>` (the five below were listed by GET /v2/audiences
#   on 2026-10-20), or {name, type} for #15 to match against that listing.
# age_band: 35_and_younger and 55_and_older are VERIFIED; 36_to_55 is UNVERIFIED until #15 sends it.
#   Age is a prompt detail and a signal for non-place domains only (it doesn't change places, E5).
# seeds: entity names with their /search type. Dining uses interest_tags (cuisines, formats)
#   because places are city-specific.
audience_policy:
  allow_identity: false

personas:
  - id: street_food_explorer
    descriptor: Hunts for cheap, fast street food and busy night markets
    age_band: 35_and_younger
    audiences: [{name: street food, type: hobbies_and_interests}]
    domains: [dining, music, film_tv, brands]
    interest_tags: {dining: [street food, night market]}
    seeds:
      music: [{name: Bad Bunny, type: urn:entity:artist}]
      film_tv: [{name: Chef, type: urn:entity:movie}]
      brands: [{name: Vans, type: urn:entity:brand}]

